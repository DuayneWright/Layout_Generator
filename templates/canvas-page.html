{% extends 'base.html' %}
{% load static %}
{% block title %} Canvas {% endblock %}

{% block styling %}
<style>
    .convert-button:disabled,
    .convert-button[disabled] {
        background-color: #6C757D;
        border: 2px solid #6C757D;
        cursor: not-allowed;
        opacity: 0.7;
    }

    .container-fluid {
        padding: 0 2rem;
    }

    .form-control {
        padding: 0.375rem 0.75rem;
        font-size: 0.9rem;
    }

    .form-label {
        margin-bottom: 0.1rem;
        font-weight: 500;
    }

    .card-header {
        padding: 0.75rem 1.25rem;
    }

    .card-body {
        padding: 1.25rem;
    }

    .shadow-toggle:focus {
        box-shadow: 0 0 0 0.2rem rgba(134, 139, 145, 0.25);
    }

    .shadow-toggle.active {
        box-shadow: 0 0 0 0.2rem rgba(134, 139, 145, 0.25);
        background-color: #f8f9fa;
    }

    .btn-orientation {
        padding: 0.3rem 1rem;
        font-size: 0.9rem;
        width: auto;
        height: auto;
    }

    .d-flex.justify-content-center.gap-3 {
        gap: 0.75rem;
    }

    .delete-button {
        appearance: none;
        background-color: #dc3545;
        border: 2px solid #dc3545;
        border-radius: 8px;
        box-sizing: border-box;
        color: #fff;
        cursor: pointer;
        display: inline-block;
        font-weight: 600;
        font-size: 20px;
    }

    .table-container {
        max-height: 500px;
        overflow-y: auto;
        margin-bottom: 1rem;
    }

    .preview-container {
        display: flex;
        overflow: hidden;
        width: 650px;
        height: 650px;
        border: 1px solid #007bff;
        margin: 0 auto;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #f8f9fa;
    }

    .save-button {
        appearance: none;
        background-color: #007bff;
        border: 2px solid #007bff;
        border-radius: 8px;
        box-sizing: border-box;
        color: #fff;
        cursor: pointer;
        display: inline-block;
        font-weight: 600;
        font-size: 20px;
    }

    .header-container {
        display: flex;
        align-items: center;
    }

    input[disabled],
    select[disabled] {
        background-color: #e9ecef;
        color: #6c757d;
        border: 1px solid #cec4da;
        cursor: not-allowed;
    }

    .centered-button {
        display: block;
        margin: 1rem auto;
    }

    #canvas {
        position: relative;
    }

    .grid {
        display: grid;
        grid-template-columns: repeat(10, 1fr);
        grid-template-rows: repeat(10, 1fr);
        width: 100%;
        height: 100%;
        gap: 1px;
        border: 2px solid #6c757d;
    }

    .control-columns {
        display: flex;
        flex-direction: column;
    }

    .properties-card {
        height: auto;
        display: flex;
        flex-direction: column;
    }

    .accordion {
        flex: 1;
        overflow-y: auto;
        max-height: 450px;
    }

    .canvas-column {
        display: flex;
        flex-direction: column;
    }

    .control-buttons {
        padding: 1rem;
        margin-top: auto;
        border-top: 1px solid rgba(0, 0, 0, .125);
    }

    .modifications-card.disabled {
        opacity: 0.5;
        pointer-events: none;
    }
</style>
{% endblock %}

{% block content %}
<header>
    <div class="d-flex justify-content-center align-items-center w-100">
        <h1 class="display-5 fw-bold" style="margin-top:0rem;">Canvas</h1>
    </div>
    <div class="header-container" style="position: absolute; right: 20px; top: 20px;">
        <button class="save-button centered-button" style="visibility: hidden;">
            Save Changes
        </button>
    </div>
</header>

<div class="container-fluid">
    <form id="layout-form" method="post">
        {% csrf_token %}
        <div class="row gx-3 gy-3">

            <!-- Lines & Objects -->
            <div class="col-lg-2 col-md-3 control-columns">
                <!-- Lines -->
                <div class="card mb-3">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h3 style="text-align: center; font-size: 1.2rem;" class="fw-bold mb-0">Lines</h3>
                    </div>
                    <div class="card-body">
                        <div style="display:flex; justify-content: center; gap: 10px; flex-wrap: wrap;"
                            class="table-container">
                            <button type="button" draggable="true" data-line-type="solid"
                                ondragstart="drag(event, this.dataset.lineType)" style="font-size: 1.2vw; width: 45%;"
                                class="btn btn-lg btn-light btn-lines shadow-toggle" id="solidLineButton"
                                onclick="toggleHighlight(this)">
                                <svg width="100%" height="auto" viewBox="0 0 100 10">
                                    <line x1="0" y1="5" x2="100" y2="5" stroke="black" stroke-width="2" />
                                </svg>
                            </button>
                            <button type="button" draggable="true" data-line-type="dashed"
                                ondragstart="drag(event, this.dataset.lineType)" style="font-size: 1.2vw; width: 45%;"
                                class="btn btn-lg btn-light btn-lines shadow-toggle" id="dashedLineButton"
                                onclick="toggleHighlight(this)">
                                <svg width="100%" height="auto" viewBox="0 0 100 10">
                                    <line x1="0" y1="5" x2="100" y2="5" stroke="black" stroke-width="2"
                                        stroke-dasharray="10,5" />
                                </svg>
                            </button>
                            <button type="button" draggable="true" data-line-type="dotted"
                                ondragstart="drag(event, this.dataset.lineType)" style="font-size: 1.2vw; width: 45%;"
                                class="btn btn-lg btn-light btn-lines shadow-toggle" id="dottedLineButton"
                                onclick="toggleHighlight(this)">
                                <svg width="100%" height="auto" viewBox="0 0 100 10">
                                    <line x1="0" y1="5" x2="100" y2="5" stroke="black" stroke-width="2"
                                        stroke-dasharray="2,2" />
                                </svg>
                            </button>
                            <button type="button" draggable="true" data-line-type="arrow"
                                ondragstart="drag(event, this.dataset.lineType)" style="font-size: 1.2vw; width: 45%;"
                                class="btn btn-lg btn-light btn-lines shadow-toggle" id="arrowLineButton"
                                onclick="toggleHighlight(this)">
                                <svg width="100%" height="auto" viewBox="0 0 100 10">
                                    <line x1="10" y1="5" x2="90" y2="5" stroke="black" stroke-width="5" />
                                    <polygon points="90,5 70,-5 70,15" fill="black" /> <!-- Arrowhead -->
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Objects -->
                <div class="card mb-3">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h3 style="text-align: center; font-size: 1.2rem;" class="fw-bold mb-0">Objects</h3>
                    </div>
                    <div class="card-body">
                        <div style="display:flex; justify-content: center; gap: 10px; flex-wrap: wrap;"
                            class="table-container">
                            <button type="button" draggable="true" data-object-type="Sensor"
                                ondragstart="drag(event, this.dataset.objectType)" style="font-size: 1.2vw; width: 45%;"
                                class="btn btn-lg btn-light btn-objects shadow-toggle" id="Sensor" onclick="toggleHighlight(this)">
                                <svg width="1.2vw" height="1.2vw" viewBox="0 0 100 100">
                                    <circle cx="50" cy="50" r="50" fill="black" />
                                </svg>
                            </button>
                            <button type="button" draggable="true" data-object-type="Calibration"
                                ondragstart="drag(event, this.dataset.objectType)" style="font-size: 1.2vw; width: 45%;"
                                class="btn btn-lg btn-light btn-objects shadow-toggle" id="CalibrationButton" onclick="toggleHighlight(this)">
                                <svg width="1.2vw" height="1.2vw" viewBox="0 0 100 100">
                                    <polygon points="50,0 100,50 50,100 0,50" fill="black" />
                                </svg>
                            </button>
                        </div>
                        <div style="display:flex; justify-content: center; gap: 10px; flex-wrap: wrap;"
                            class="table-container">
                            <button type="button" draggable="true" data-object-type="Camera"
                                ondragstart="drag(event, this.dataset.objectType)" style="font-size: 1.2vw; width: 45%;"
                                class="btn btn-lg btn-light btn-objects shadow-toggle" id="CameraButton" onclick="toggleHighlight(this)">
                                <svg width="1.2vw" height="1.2vw" viewBox="0 0 100 100" transform="rotate(90)">
                                    <circle cx="50" cy="30" r="30" fill="black" />
                                    <polygon points="50,40 150,150 -50,150" fill="black" />
                                </svg>
                            </button>
                            <button type="button" draggable="true" data-object-type="whiteCircle"
                                ondragstart="drag(event, this.dataset.objectType)" style="font-size: 1.2vw; width: 45%;"
                                class="btn btn-lg btn-light btn-objects shadow-toggle" id="circleButton" onclick="toggleHighlight(this)">
                                <svg width="1.2vw" height="1.2vw" viewBox="0 0 100 100">
                                    <circle cx="50" cy="50" r="45" fill="white" stroke="black" stroke-width="5" />
                                </svg>
                            </button>
                        </div>
                        <div style="display:flex; justify-content: center; gap: 10px; flex-wrap: wrap;"
                            class="table-container">
                            <button type="button" draggable="true" data-object-type="square"
                                ondragstart="drag(event, this.dataset.objectType)" style="font-size: 1.2vw; width: 45%;"
                                class="btn btn-lg btn-light btn-objects shadow-toggle" id="squareButton" onclick="toggleHighlight(this)">
                                <svg width="1.2vw" height="1.2vw" viewBox="0 0 100 100">
                                    <rect x="10" y="10" width="80" height="80" fill="white" stroke="black"
                                        stroke-width="5" />
                                </svg>
                            </button>
                        </div>
                        <div style="display:flex; justify-content: center; gap: 10px; flex-wrap: wrap;"
                            class="table-container">
                            <button type="button" draggable="true" data-object-type="dottedCircle"
                                ondragstart="drag(event, this.dataset.objectType)" style="font-size: 1.2vw; width: 45%;"
                                class="btn btn-lg btn-light btn-objects shadow-toggle" id="dottedCircleButton" onclick="toggleHighlight(this)">
                                <svg width="1.2vw" height="1.2vw" viewBox="0 0 100 100">
                                    <circle cx="50" cy="50" r="45" fill="none" stroke="black" stroke-width="5"
                                        stroke-dasharray="5,5" />
                                </svg>
                            </button>
                            <button type="button" draggable="true" data-object-type="dottedSquare"
                                ondragstart="drag(event, this.dataset.objectType)" style="font-size: 1.2vw; width: 45%;"
                                class="btn btn-lg btn-light btn-objects shadow-toggle" id="dottedSquareButton" onclick="toggleHighlight(this)">
                                <svg width="1.2vw" height="1.2vw" viewBox="0 0 100 100">
                                    <rect x="10" y="10" width="80" height="80" fill="none" stroke="black"
                                        stroke-width="5" stroke-dasharray="5,5" />
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>
                <div class="d-flex justify-content-center gap-3 p-3">
                    <button type="button" id="toggleModeButton" class="btn btn-primary" onclick="toggleMode()">
                        <i id="toggleModeIcon" class="bi bi-brush"></i>
                    </button>
                    <script>
                        function toggleMode() {
                            const toggleButton = document.getElementById("toggleModeButton");
                            const toggleIcon = document.getElementById("toggleModeIcon");
                            if (window.mode === 'draw') {
                                selectMode('drag');
                                toggleIcon.classList.remove('bi-brush');
                                toggleIcon.classList.add('bi-hand-index-thumb');
                            } else {
                                selectMode('draw');
                                toggleIcon.classList.remove('bi-hand-index-thumb');
                                toggleIcon.classList.add('bi-brush');
                            }
                        }
                    </script>
                </div>
            </div>

            <!-- Canvas -->
            <div class="col-lg-7 col-md-6 canvas-column">
                <div class="preview-container">
                    <canvas id="canvas" style="border: 1px solid #6c757d; width: 100%; height: 100%;"></canvas>
                </div>
                <div class="convert-button-box" style="display: flex; justify-content: center; margin-top: 1rem;">
                    <button type="button" id="convert" class="convert-button">Save Layout</button>
                </div>
            </div>

            <!-- Properties -->
            <div class="col-lg-3 col-md-3 control-columns">
                <form id="general-info-form" method="POST" action="{% url 'layout_form' %}">
                    {% csrf_token %}
                    <div class="card mb-4">
                        <div class="card-header">
                            <h3 class="fw-bold mb-0">General Information</h3>
                        </div>
                        <div class="card-body">
                            <div class="row gx-3 gy-3">
                                <div class="col-md-12">
                                    <label for="layout_name" class="form-label">Layout Name:</label>
                                    <input type="text" class="form-control" id="layout_name" name="layout_name" required>
                                </div>
                                <!-- Neighborhood & Building -->
                                <div class="col-md-6">
                                    <label for="neighborhood" class="form-label">Neighborhood:</label>
                                    <input type="text" class="form-control" id="neighborhood" name="neighborhood" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="building" class="form-label">Building:</label>
                                    <input type="text" class="form-control" id="building" name="building" required>
                                </div>
        
                                <!-- Room Name & Date -->
                                <div class="col-md-6">
                                    <label for="room_name" class="form-label">Room Name:</label>
                                    <input type="text" class="form-control" id="room_name" name="room_name" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="date" class="form-label">Date:</label>
                                    <input type="date" class="form-control" id="date" name="date" required>
                                </div>
                                
                                <!-- Step & File Orientation -->
                                <div style="display: flex; gap: 1rem;">
                                    <div style="flex: 1;">
                                        <label for="step" class="form-label">Step:</label>
                                        <select class="form-control form-control-sm" name="step[]" onChange="extractOption(this);" required>
                                            <option value="24" selected>24</option>
                                            <option value="36">36</option>
                                        </select>
                                    </div>
                                
                                    <div style="flex: 1; text-align: center;">
                                        <label class="form-label">File Orientation</label>
                                        <input type="hidden" id="id_orientation" name="orientation"
                                            value="{{ orientation_value }}">
                                        <div class="d-flex justify-content-center gap-3">
                                            <button type="button" class="btn btn-light shadow-toggle"
                                                id="portraitButton">Portrait</button>
                                            <button type="button" class="btn btn-light shadow-toggle"
                                                id="landscapeButton">Landscape</button>
                                        </div>
                                    </div>
                                </div>
        
                                <script>
                                    var stepOption = "24"
                                    function extractOption(sel) {
                                        stepOption = (sel.options[sel.selectedIndex].text);
                                    }
        
                                    // Handle orientation button clicks
                                    document.getElementById("portraitButton").onclick = function() {
                                        document.getElementById("id_orientation").value = "portrait";
                                    };
                                    document.getElementById("landscapeButton").onclick = function() {
                                        document.getElementById("id_orientation").value = "landscape";
                                    };                              
                                </script>
        
                            </div>
                        </div>
                    </div>
                </form>
                <div class="card properties-card">
                    <div class="card-header text-center">
                        <h3 class="fw-bold mb-0" style="font-size: 1.2rem;">Properties</h3>
                    </div>                    
                    <div class="card-body">
                        <div class="col-md-12 mb-3">
                            <div class="d-flex align-items-center justify-content-between">
                                <label for="x-label" class="form-label me-2">X:</label>
                                <input type="number" class="form-control" id="x-label" name="x-label" required
                                    onfocus="this.value=this.placeholder" onblur="!this.value&&(this.value=this.placeholder);">
                            </div>
                        </div>
                        <div class="col-md-12 mb-3">
                            <div class="d-flex align-items-center justify-content-between">
                                <label for="y-label" class="form-label me-2">Y:</label>
                                <input type="number" class="form-control" id="y-label" name="y-label" required
                                    onfocus="this.value=this.placeholder" onblur="!this.value&&(this.value=this.placeholder);">
                            </div>
                        </div>
                        <div class="col-md-12 mb-3">
                            <div class="d-flex align-items-center justify-content-between">
                                <label for="rotation" class="form-label me-2">Rotation:</label>
                                <input type="number" class="form-control" id="rotation" name="rotation" required
                                    onfocus="this.value=this.placeholder" onblur="!this.value&&(this.value=this.placeholder);">
                            </div>
                        </div>
                        <div class="col-md-12 mb-3">
                            <div class="d-flex align-items-center justify-content-between">
                                <label for="length" class="form-label me-2">Length:</label>
                                <input type="number" class="form-control" id="length" name="length" required
                                    onfocus="this.value=this.placeholder" onblur="!this.value&&(this.value=this.placeholder);">
                            </div>
                        </div>
                        <div class="col-md-12 mb-3">
                            <div class="d-flex align-items-center justify-content-between">
                                <label for="width" class="form-label me-2">Width:</label>
                                <input type="number" class="form-control" id="width" name="width" required
                                    onfocus="this.value=this.placeholder" onblur="!this.value&&(this.value=this.placeholder);">
                            </div>
                        </div>
                        <div class="col-md-12 mb-3">
                            <div class="d-flex align-items-center justify-content-between">
                                <label for="descriptor" class="form-label me-2">Descriptor:</label>
                                <input type="text" class="form-control" id="descriptor" name="descriptor" required>
                            </div>
                        </div>
                        <div class="col-md-12 mb-3">
                            <div class="d-flex align-items-center justify-content-between">
                                <label for="color" class="form-label me-2">Color:</label>
                                <input type="color" class="form-control" id="color" name="color" required>
                            </div>
                        </div>
                        <div class="control-buttons d-flex justify-content-center gap-2 mt-3">
                            <button type="button" class="delete-button px-2 py-2" onclick="deleteElement()">Delete</button>
                            <button type="button" class="save-button px-2 py-2" onclick="updateElement()">Update</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </form>

    <!-- Delete All Layouts Button and Form -->
    <div class="row justify-content-end">
        <div class="col-auto pb-3">
            <button type="button" onclick="clearGrid()" class="btn btn-danger" style="width: 100%;">Clear
                Canvas</button>
        </div>
    </div>
</div>

<script>
    const container = document.querySelector('.preview-container');
    const canvas = document.getElementById('canvas');
    function getInchesFromCenter(x, y) {
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;

        const relativeX = x - centerX;
        const relativeY = centerY - y; // Flip y-axis since canvas increases downward

        return {
                xInches: (relativeX / 4).toFixed(2),
                yInches: (relativeY / 4).toFixed(2)
        };
    }

    const ctx = canvas.getContext('2d');
    let currentLineType = 'solid';
    let selectedElementIndex = -1;
    let selectedElement = null;
    let isDragging = false;
    let isDrawing = false;
    let offsetX, offsetY;
    let undoStack = [];
    let objects = [];
    let lines = [];
    let startY = 0;
    let startX = 0;
    window.mode = 'draw';

    function toggleHighlight(button) {
        // Remove highlight from all buttons
        document.querySelectorAll('.btn-lines').forEach(btn => {
            btn.classList.remove('highlighted');
            btn.style.backgroundColor = ''; // Reset color
        });

        document.querySelectorAll('.btn-objects').forEach(btn => {
            btn.classList.remove('highlighted');
            btn.style.backgroundColor = ''; // Reset color
        });

        // Highlight the clicked button
        button.classList.add('highlighted');
        button.style.backgroundColor = 'rgba(0, 123, 255, 0.1)'; // Highlight color
    }

    function drawCenterDot() {
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        ctx.beginPath();
        ctx.arc(centerX, centerY, 5, 0, Math.PI * 2);
        ctx.fillStyle = 'blue';
        ctx.fill();
        ctx.font = '12px Arial';
        ctx.fillStyle = 'black';
        ctx.fillText('(0, 0)', centerX - 14, centerY + 14);
    }

    // Call drawCenterDot when the canvas is resized or initially loaded
    function resizeCanvas() {
        canvas.width = container.clientWidth;
        canvas.height = container.clientHeight;
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas(); // Initial call to set the canvas size and draw the center dot

    ['solid', 'dashed', 'dotted', 'arrow'].forEach(type => {
        document.getElementById(`${type}LineButton`).addEventListener('click', () => {
            currentLineType = type;
        });
    });

    let isResizing = false;
    let resizePointIndex = -1;

    function getOriginalAspectRatio(obj) {
        return obj.width / obj.height;
    }

    let isPivoting = false;
    let pivotPoint = null; // Will store the fixed endpoint
    let pivotingEndpoint = null; // Will be either 'start' or 'end'

    canvas.addEventListener('mousedown', (e) => {
        const { offsetX, offsetY } = e;
        
        // If we're in drag mode and have a selected object (not a line)
        if (mode === 'drag' && selectedElement && !selectedElement.hasOwnProperty('startX')) {
            // Check if we're clicking on a resize point
            const obj = selectedElement;
            const cornerPoints = [
                { x: obj.x, y: obj.y }, // top-left
                { x: obj.x + obj.width, y: obj.y }, // top-right
                { x: obj.x, y: obj.y + obj.height }, // bottom-left
                { x: obj.x + obj.width, y: obj.y + obj.height } // bottom-right
            ];
            
            for (let i = 0; i < cornerPoints.length; i++) {
                const point = cornerPoints[i];
                const distance = Math.sqrt((offsetX - point.x) ** 2 + (offsetY - point.y) ** 2);
                
                if (distance < 10) { // 10px detection radius for corner points
                    isResizing = true;
                    resizePointIndex = i;
                    startX = offsetX;
                    startY = offsetY;
                    
                    // Store original aspect ratio when starting a resize
                    selectedElement.originalAspectRatio = getOriginalAspectRatio(selectedElement);
                    return;
                }
            }
        }

        if (mode === 'draw') {
            const hoveredLine = lines.find(line => {
                const distanceToStart = Math.sqrt((offsetX - line.startX) ** 2 + (offsetY - line.startY) ** 2);
                const distanceToEnd = Math.sqrt((offsetX - line.endX) ** 2 + (offsetY - line.endY) ** 2);
                return distanceToStart < 15 || distanceToEnd < 15;
            });

            if (hoveredLine) {
                const distanceToStart = Math.sqrt((offsetX - hoveredLine.startX) ** 2 + (offsetY - hoveredLine.startY) ** 2);
                const distanceToEnd = Math.sqrt((offsetX - hoveredLine.endX) ** 2 + (offsetY - hoveredLine.endY) ** 2);
                isDrawing = true;
                if (distanceToStart < 15) {
                    startX = hoveredLine.startX;
                    startY = hoveredLine.startY;
                } else if (distanceToEnd < 15) {
                    startX = hoveredLine.endX;
                    startY = hoveredLine.endY;
                }
                return;
            }

            // Check if clicking on object
            const hoveredObject = objects.find(obj => {
                const centerX = obj.x + obj.width / 2;
                const centerY = obj.y + obj.height / 2;

                if (["Sensor", "whiteCircle", "dottedCircle"].includes(obj.type)) {
                    return Math.sqrt((offsetX - centerX) ** 2 + (offsetY - centerY) ** 2) < obj.width / 2;
                }
                return offsetX >= obj.x && offsetX <= obj.x + obj.width &&
                    offsetY >= obj.y && offsetY <= obj.y + obj.height;
            });

            if (hoveredObject) {
                showErrorMessage('Cannot drag objects in Draw mode. Switch to Drag mode first.');
                return;
            }

            // Check if on line body

                    break;
                case "Camera":
                    ctx.setLineDash([]);
                    ctx.fillStyle = obj.color || "black";

                    ctx.save(); // Save the current state of the canvas
                    ctx.rotate(Math.PI / 2); // Rotate 90 degrees clockwise

                    ctx.beginPath();
                    ctx.arc(0, -obj.height / 6, obj.width / 3, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.beginPath();
                    ctx.moveTo(0, -obj.height / 6);
                    ctx.lineTo(obj.width / 2, obj.height / 2);
                    ctx.lineTo(-obj.width / 2, obj.height / 2);
                    ctx.closePath();
                    ctx.fill();

                    ctx.restore(); // Restore the canvas to its original state
                    break;
            }

            if (selectedElementIndex - lines.length === index && !selectedElement.hasOwnProperty('startX')) {
                ctx.strokeStyle = "blue";
                ctx.lineWidth = 2;
                ctx.setLineDash([]);

                if (["Sensor", "whiteCircle", "dottedCircle"].includes(obj.type)) {
                    ctx.beginPath();
                    ctx.arc(0, 0, obj.width / 2 + 5, 0, Math.PI * 2);
                    ctx.stroke();
                } else if (obj.type === "Calibration") {
                    ctx.rotate(Math.PI / 4);
                    ctx.strokeRect(-obj.width / 2 - 5, -obj.height / 2 - 5, obj.width + 10, obj.height + 10);
                } else {
                    ctx.strokeRect(-obj.width / 2 - 5, -obj.height / 2 - 5, obj.width + 10, obj.height + 10);
                }

                ctx.fillStyle = obj.color || "blue";
                ctx.beginPath();
                ctx.arc(-obj.width / 2, -obj.height / 2, 5, 0, Math.PI * 2);
                ctx.fill();

                ctx.beginPath();
                ctx.arc(obj.width / 2, -obj.height / 2, 5, 0, Math.PI * 2);
                ctx.fill();

                ctx.beginPath();
                ctx.arc(-obj.width / 2, obj.height / 2, 5, 0, Math.PI * 2);
                ctx.fill();

                ctx.beginPath();
                ctx.arc(obj.width / 2, obj.height / 2, 5, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.restore();
        });
    }

    function isHoveringOverLine(x, y, line) {
        const HOVER_THRESHOLD = 15; // Adjust this for more or less sensitivity

        const distanceToLine = Math.abs((line.endY - line.startY) * x -
            (line.endX - line.startX) * y +
            line.endX * line.startY - line.endY * line.startX) /
            Math.hypot(line.endX - line.startX, line.endY - line.startY);

        // Extend the line segment's bounding box slightly
        const buffer = HOVER_THRESHOLD;
        const withinExtendedBounds = x >= Math.min(line.startX, line.endX) - buffer &&
            x <= Math.max(line.startX, line.endX) + buffer &&
            y >= Math.min(line.startY, line.endY) - buffer &&
            y <= Math.max(line.startY, line.endY) + buffer;

        return distanceToLine < HOVER_THRESHOLD && withinExtendedBounds;
    }

    // Add this function to check if hovering over a line endpoint
    function isHoveringOverLineEndpoint(x, y, line) {
        const startDistance = Math.sqrt((x - line.startX) ** 2 + (y - line.startY) ** 2);
        const endDistance = Math.sqrt((x - line.endX) ** 2 + (y - line.endY) ** 2);
        return { 
            isStart: startDistance < 10, 
            isEnd: endDistance < 10,
            isEither: startDistance < 10 || endDistance < 10
        };
    }

    function isHoveringOverObject(x, y, obj) {
        if (!obj) return false;

        // Check if point is within object bounds
        return (
            x >= obj.x &&
            x <= obj.x + obj.width &&
            y >= obj.y &&
            y <= obj.y + obj.height
        );
    }

    function undoLastAction() {
        if (undoStack.length > 0) {
            const lastAction = undoStack.pop();
            const lineIndex = lines.findIndex(line => line.startX === lastAction.startX && line.startY === lastAction.startY && line.endX === lastAction.endX && line.endY === lastAction.endY);
            const objectIndex = objects.findIndex(obj => obj.x === lastAction.x && obj.y === lastAction.y && obj.type === lastAction.type);
            if (lineIndex !== -1) {
                lines.splice(lineIndex, 1);
            } else if (objectIndex !== -1) {
                objects.splice(objectIndex, 1);
            }
            drawAllElements();
            saveCanvasChanges();
        }
    }

    function drop(event) {
        event.preventDefault();

        // Only allow dropping if in drag mode
        if (window.mode !== 'draw') {
            showErrorMessage('Drop functionality is only available in Drag mode');
            return;
        }

        var itemType = event.dataTransfer.getData("itemType");
        var lineTypes = ["solid", "dashed", "dotted", "arrow"];
        var objectTypes = ["Sensor", "Calibration", "Camera", "whiteCircle", "square", "dottedCircle", "dottedSquare", "label"];

        // Get the drop coordinates relative to the canvas
        var rect = canvas.getBoundingClientRect();
        var x = event.clientX - rect.left;
        var y = event.clientY - rect.top;

        if (lineTypes.includes(itemType)) {
            // Handle line types using existing lines array
            const newLine = {
                startX: x,
                startY: y,
                endX: x + 100, // Default length
                endY: y,
                length: 25, // Default length in inches (100px/4)
                type: itemType,
                color: 'black',
                rotation: 0,
                descriptor: document.getElementById('descriptor').value
            };

            lines.push(newLine);
            undoStack.push(newLine);

            // Select the newly created line
            selectedElement = newLine;
            selectedElementIndex = lines.length - 1;
            updateLineUI(selectedElement);

        } else if (objectTypes.includes(itemType)) {
            // Create a new object with proper properties
            const newObject = {
                x: x,
                y: y,
                width: itemType === "label" ? 50 : 30, // Default width
                height: itemType === "label" ? 20 : 30, // Default height
                type: itemType,
                rotation: 0,
                text: document.getElementById('descriptor').value
            };

            objects.push(newObject);
            undoStack.push(newObject);

            // Select the newly created object
            selectedElement = newObject;
            selectedElementIndex = lines.length + objects.length - 1;  // Fix index calculation
            updateObjectUI(selectedElement);
        }

        drawAllElements();
        saveCanvasChanges();  // This is already here but now will work correctly
    }

            updateObjectUI(selectedElement);
        }

    function updateElement() {
        if (selectedElementIndex === -1 || !selectedElement) {
            console.error("No element is currently selected.");
            return;
        }

        console.log("Updating element:", selectedElement);

        // Get values from form
        var xValue = document.getElementById('x-label').value;
        var yValue = document.getElementById('y-label').value;
        var rotationValue = document.getElementById('rotation').value;
        var lengthValue = document.getElementById('length').value;
        var colorValue = document.getElementById('color').value;
        var widthValue = document.getElementById('width').value;
        var descriptorValue = document.getElementById('descriptor').value;

        // Validate length - prevent negative values
        if (lengthValue && parseFloat(lengthValue) < 0) {
            showErrorMessage("Length cannot be negative.");
            return;
        }

        // Parse color and descriptor for all element types
        var color = colorValue || selectedElement.color || 'black';
        var descriptor = descriptorValue || selectedElement.text || selectedElement.descriptor || '';

        if (selectedElement.hasOwnProperty('startX')) {
            // Updating a line
            console.log("Updating line...");
            
            // Get current values
            var startX = selectedElement.startX;
            var startY = selectedElement.startY;
            var endX = selectedElement.endX;
            var endY = selectedElement.endY;
            var length = selectedElement.length;
            var rotation = selectedElement.rotation;
            
            // If x or y is provided, update the end coordinates
            if (xValue || yValue) {
                // Get coordinates from center in pixels
                const centerX = canvas.width / 2;
                const centerY = canvas.height / 2;
                
                if (xValue) {
                    endX = centerX + parseFloat(xValue) * 4;
                }
                
                if (yValue) {
                    endY = centerY - parseFloat(yValue) * 4; // Flip y-axis
                }
                
                // Recalculate length and rotation based on new end coordinates
                const deltaX = endX - startX;
                const deltaY = endY - startY;
                length = Math.round((Math.sqrt(deltaX ** 2 + deltaY ** 2) / 4) * 100) / 100;
                rotation = Math.round((Math.atan2(deltaY, deltaX) * (180 / Math.PI)) * 100) / 100;
            }
            
            // If rotation or length is provided, update end coordinates based on those
            if (rotationValue || lengthValue) {
                rotation = rotationValue ? -parseFloat(rotationValue) : rotation; // Flip sign
                length = lengthValue ? parseFloat(lengthValue) : length;
                
                // Calculate new end coordinates
                endX = startX + length * 4 * Math.cos(rotation * (Math.PI / 180));
                endY = startY + length * 4 * Math.sin(rotation * (Math.PI / 180));
            }
            
            // Update the line object
            selectedElement.endX = endX;
            selectedElement.endY = endY;
            selectedElement.rotation = rotation;
            selectedElement.length = length;
            selectedElement.color = color;
            selectedElement.descriptor = descriptor;
            lines[selectedElementIndex] = selectedElement;
        } else {
            // Updating an object
            console.log("Updating object...", selectedElement);
            var objectIndex = selectedElementIndex - lines.length;
            
            // Handle x and y updates - convert from inches to pixels
            if (xValue) {
                const centerX = canvas.width / 2;
                selectedElement.x = centerX + parseFloat(xValue) * 4;
            }
            
            if (yValue) {
                const centerY = canvas.height / 2;
                selectedElement.y = centerY - parseFloat(yValue) * 4; // Flip y-axis
            }
            
            // Handle other properties
            if (rotationValue) {
                selectedElement.rotation = -parseFloat(rotationValue); // Flip sign
            }

            if (lengthValue) {
                selectedElement.height = parseFloat(lengthValue);
            }
            
            if (widthValue) {
                selectedElement.width = parseFloat(widthValue);
                // For certain objects, keep width and height equal
                if (["Sensor", "whiteCircle", "dottedCircle", "Calibration", "Camera"].includes(selectedElement.type)) {
                    selectedElement.height = parseFloat(widthValue);
                }
            }
            
            if (descriptorValue) {
                selectedElement.text = descriptorValue;
            }
            
            if (colorValue) {
                selectedElement.color = color;
            }
            
            objects[objectIndex] = selectedElement;
        }

        // Clear form fields
        document.getElementById('x-label').value = '';
        document.getElementById('y-label').value = '';
        document.getElementById('rotation').value = '';
        document.getElementById('length').value = '';
        document.getElementById('width').value = '';
        document.getElementById('descriptor').value = '';

        // Redraw and update UI
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawAllElements();

        if (selectedElement.hasOwnProperty('startX')) {
            updateLineUI(selectedElement);
        } else {
            updateObjectUI(selectedElement);
        }

        // Save changes to server
        saveCanvasChanges();
        console.log("Element updated:", selectedElement);
    }

    // SAVING/LOADING CANVAS CONTENT
    function serializeCanvasContent() {
        // Create object to hold all canvas data
        const canvasData = {
            lines: lines,
            objects: objects,
        };

        return JSON.stringify(canvasData);
    }

    // Function to save canvas data to server
    function saveCanvasChanges() {
        const canvasData = serializeCanvasContent();
        const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;

        // Send data to server using fetch API
        fetch('{% url "save_canvas" %}', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': csrfToken
            },
            body: canvasData
        })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                return response.json();
            })
            .then(data => {
                if (!data.success) {
                    console.error('Error saving canvas:', data.error);
                    alert('Failed to save canvas changes');
                }
            })
            .catch(error => {
                console.error('Error saving canvas:', error);
                alert('Failed to save canvas changes');
            });
    }

            console.error('Error restoring canvas:', error);

    const monthNames = [
        "January", "February", "March", "April",
        "May", "June", "July", "August",
        "September", "October", "November", "December"
    ];

    // Helper function to safely get element value
    function getElementValue(id) {
        const element = document.getElementById(id);
        return element ? element.value : '';
    }

    function setLayoutDefaults(formattedData){
        // Converts the data format into long date 
        const dateInput = document.getElementById('date').value;

        // Split the input value into year, month, and day
        const [year, month, day] = dateInput.split('-');

        // Convert the month number to the month name
        const monthName = monthNames[parseInt(month) - 1];

        // Combine the elements into a long form date string
        const longFormDate = `${year} ${monthName} ${day}`;

        filteredStep = stepOption ? parseInt(stepOption, 10) : 24;

        formattedData.push(
            createDataObject("Orientation", getElementValue("id_orientation")),
            createDataObject("Neighborhood", getElementValue("neighborhood")),
            createDataObject("Building", getElementValue("building")),
            createDataObject("Room Name", getElementValue("room_name")),
            createDataObject("Date", longFormDate),
            createDataObject("X Axis", null, 0, 197, filteredStep),
            createDataObject("Y Axis", null, 0, 293, filteredStep)
        );

        return formattedData;
    }

    // Read data from canvas
    function readCanvas(formattedData) {
        // Initialize variables for X and Y axis min and max values
        Xs = Ys = [0,0]

        // Read lines and objects from the canvas
        lines.forEach((line, index) => {
            console.log('Line:', line);
            const startPosition = getInchesFromCenter(line.startX, line.startY);
            const startX = startPosition.xInches;
            const startY = startPosition.yInches;

            const endPosition = getInchesFromCenter(parseInt(line.endX), parseInt(line.endY));
            const endX = endPosition.xInches;
            const endY = endPosition.yInches;

            try {
                const x = startX || 0;
                const y = startY || 0;
                const x_2 = endX || 0;
                const y_2 = endY || 0;

                Xs = [Math.min(Xs[0], x, x_2), Math.max(Xs[1], x, x_2)];
                Ys = [Math.min(Ys[0], y, y_2), Math.max(Ys[1], y, y_2)];

                const descriptor = line.descriptor || ' ';
                const itemType = line.type === "arrow" ? "Room Navigation" : 
                        (line.type === "solid" || line.type === "dashed" || line.type === "dotted") ? "Wall" : null;

                if (itemType === "Wall") {
                    const item = {
                        "Type": itemType,
                        "Descriptor": descriptor,
                        "X": x,
                        "Y": y,
                        "width": 0,
                        "length": 0,
                        "radius": 0,
                        "scale": 1,
                        "rotation": 0,
                        "room_navigation_direction": null,
                        "furniture_type": null,
                        "step": null
                    };
                    formattedData.push(item);

                    const item2 = {
                        "Type": itemType,
                        "Descriptor": descriptor,
                        "X": endX ? x_2 : x,
                        "Y": endY ? y_2 : y,
                        "width": 0,
                        "length": 0,
                        "radius": 0,
                        "scale": 1,
                        "rotation": 0,
                        "room_navigation_direction": null,
                        "furniture_type": null,
                        "step": null
                    };
                    formattedData.push(item2);
                }
                else if (itemType === "Room Navigation") {
                    const item = {
                        "Type": itemType,
                        "Descriptor": descriptor,
                        "X": x_2,
                        "Y": y_2,
                        "width": 0,
                        "length": line.length || 0,
                        "radius": 0,
                        "scale": 1,
                        "rotation": (line.rotation - 180) || 0,
                        "room_navigation_direction": null,
                        "furniture_type": null,
                        "step": null
                    };
                    formattedData.push(item);
                }
            } catch (error) {
                console.error('Error processing row:', error);
            }
        });

        // Read objects from the canvas
        objects.forEach((object, index) => {
            console.log('Object:', object);
            const position = getInchesFromCenter(object.x, object.y);
            const x = parseFloat(position.xInches) || 0;
            const y = parseFloat(position.yInches) || 0;

            Xs = [Math.min(Xs[0], x), Math.max(Xs[1], x)];
            Ys = [Math.min(Ys[0], y), Math.max(Ys[1], y)];

            const objectType = ["whiteCircle", "dottedCircle", "dottedSquare", "square"].includes(object.type) ? "Furniture" : object.type;
            const descriptor = object.text || ' ';
            const furniture_type = ["whiteCircle", "dottedCircle"].includes(object.type) ? "Circle" : ["dottedSquare", "square"].includes(object.type) ? "Rectangle" : null;
            
            // Convert dimensions from pixels to inches
            const widthInInches = pixelsToInches(object.width || 0);
            const heightInInches = pixelsToInches(object.height || 0);
            const radiusInInches = furniture_type === "Circle" ? widthInInches / 2 : 0;

            const item = {
                "Type": objectType,
                "Descriptor": descriptor,
                "X": x,
                "Y": y,
                "width": widthInInches,
                "length": heightInInches,
                "radius": radiusInInches,
                "scale": 1,
                "rotation": object.rotation || 0,
                "room_navigation_direction": null,
                "furniture_type": furniture_type,
                "step": null
            };

            formattedData.push(item);
        });

        // Update X Axis min and max values in formattedData
        let xAxisIndex = formattedData.findIndex(item => item.Type === "X Axis");
        if (xAxisIndex !== -1) {
            formattedData[xAxisIndex].min = Xs[0];
            formattedData[xAxisIndex].max = Xs[1];
        }

        // Update Y Axis min and max values in formattedData
        let yAxisIndex = formattedData.findIndex(item => item.Type === "Y Axis");
        if (yAxisIndex !== -1) {
            formattedData[yAxisIndex].min = Ys[0];
            formattedData[yAxisIndex].max = Ys[1];
        }

        return formattedData;
    }
    
    // Convert Button functionality
    document.addEventListener("DOMContentLoaded", function () {
        const convertButton = document.getElementById("convert");
        const layoutForm = document.getElementById("layout-form");
        const layout_name = document.getElementById("layout_name");

        convertButton.addEventListener("click", function (e) {
            e.preventDefault();

            // Validate layout name first
            let layoutNameValue = layout_name.value.trim();
            
            // Check if layout name is empty
            if (!layoutNameValue) {
            alert('Layout name cannot be blank.');
            return;
            }
            
            // Replace spaces with underscores
            layoutNameValue = layoutNameValue.replace(/ /g, '_');
            
            // Check for special characters other than underscore and hyphen
            const validNameRegex = /^[a-zA-Z0-9_-]+$/;
            if (!validNameRegex.test(layoutNameValue)) {
            alert('Layout name can only contain letters, numbers, underscores, and hyphens.');
            return;
            }
            
            // Remove extension if present
            if (layoutNameValue.includes('.')) {
            layoutNameValue = layoutNameValue.split('.')[0];
            }
            
            // Update the input value with the sanitized name
            layout_name.value = layoutNameValue;

            let formattedData = [];
            setLayoutDefaults(formattedData);
            readCanvas(formattedData);
            console.log('Formatted Data:', formattedData);

            // Create loading overlay with message
            const loadingOverlay = Object.assign(document.createElement('div'), {
            id: 'loading-overlay',
            style: 'position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(255, 255, 255, 0.8); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999;'
            });
            
            // Create spinner element
            const spinner = Object.assign(document.createElement('div'), {
            className: 'spinner-border',
            style: 'display: inline-block; width: 3rem; height: 3rem; vertical-align: text-bottom; border: 0.25em solid #1a9cdd; border-right-color: transparent; border-radius: 50%; animation: spinner-border 0.75s linear infinite;'
            });

            // Create message element
            const message = Object.assign(document.createElement('div'), {
            textContent: 'Sending to Layout Library',
            style: 'margin-top: 1rem; font-size: 1.2rem; color: #1a9cdd; font-weight: bold;'
            });
            
            // Add spinner and message to loading overlay
            loadingOverlay.appendChild(spinner);
            loadingOverlay.appendChild(message);
            document.body.appendChild(loadingOverlay);
            
            // Send data to backend
            fetch('/process_layout_2/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
            },
            body: JSON.stringify({
                layoutData: formattedData,
                layoutId: null,
                layoutName: layoutNameValue,
                canvas: true
            })
            })
            .then(response => response.json())

            .then(data => {
            if (data.success) {
                document.body.removeChild(loadingOverlay); // Remove loading overlay

                console.log('Layout processed successfully:', data);
                // Create a hidden input to pass the redirect URL
                const redirectInput = document.createElement('input');
                redirectInput.type = 'hidden';
                redirectInput.name = 'redirect_url';
                redirectInput.value = data.redirect_url;
                layoutForm.appendChild(redirectInput);

                // Submit the form
                layoutForm.submit();
            } else {
                alert('Error: ' + data.error);
                document.body.removeChild(loadingOverlay); // Remove loading overlay
            }
            })
            .catch(error => {
            console.error('Error:', error);
            alert('An error occurred while processing the layout');
            document.body.removeChild(loadingOverlay); // Remove loading overlay
            });
        });
    });

</script>
