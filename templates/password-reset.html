{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Password Reset</title>
    <!-- Favicon -->
    <link rel="icon" href="{% static 'images/asset_abbr_logo_tm.png' %}" type="image/x-icon">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;800&display=swap');

        * {
            box-sizing: border-box;
        }

        body {
            background-color: #f6f5f7;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Montserrat', sans-serif;
            margin: 0;
        }

        .reset-password-container {
            background-color: #fff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 14px 28px rgba(0, 0, 0, 0.25), 0 10px 10px rgba(0, 0, 0, 0.22);
            max-width: 400px;
            width: 100%;
            text-align: center;
        }

        .company-logo img {
            max-width: 70%;
            height: auto;
        }

        h3 {
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
            margin-top: 0;
        }

        p {
            font-size: 14px;
            color: #333;
            margin-top: 20px;
        }

        a {
            color: #1a9cdd;
            text-decoration: none;
            font-size: 14px;
            margin-top: 10px;
        }

        a:hover {
            text-decoration: underline;
        }

        .alert {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            border-radius: 5px;
            padding: 10px;
            margin-top: 10px;
            font-size: 12px;
        }

        .alert-primary {
            background-color: #d1ecf1;
            color: #0c5460;
            font-size: 12px;
            padding: 10px;
            border: 1px solid #bee5eb;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        input[type="password"] {
            background-color: #eee;
            border: none;
            border-radius: 20px;
            padding: 12px 15px;
            margin-top: 10px;
            width: 100%;
            outline: none;
            color: #000000;
            font-family: 'Montserrat', sans-serif;
        }

        button {
            width: 100%;
            border-radius: 20px;
            border: 1px solid #1a9cdd;
            background-color: #1a9cdd;
            color: #ffffff;
            font-size: 11px;
            font-weight: bold;
            padding: 12px 15px;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: transform 80ms ease-in;
            font-family: 'Montserrat', sans-serif;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background-color: #1f6a96;
        }
    </style>
</head>

<body>
    <div class="reset-password-container">
        <h3>Password Reset</h1>
            <div class="company-logo">
                <img src="{% static 'images/asset_primary_logo_tm.png' %}" alt="Company Logo">
            </div>
            {% if form.errors %}
            <div class="alert">
                <b>Error:</b>
                {% for field, errors in form.errors.items %}
                {% for error in errors %}
                {{ error }}
                {% endfor %}
                {% endfor %}
            </div>
            {% endif %}
            <form method="post" class="reset-password-form">
                {% csrf_token %}
                <input type="password" placeholder="New Password" name="new_password1" id="new_password1" required>
                <input type="password" placeholder="Confirm New Password" name="new_password2" id="new_password2"
                    required>
                <button type="submit" class="btn btn-primary">Submit</button>
                <p>Remembered your password? <a href="{% url 'auth-page' %}" class="forgot-password">Log in!</a></p>
            </form>
    </div>
</body>

</html>
