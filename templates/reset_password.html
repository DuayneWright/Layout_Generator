{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Forgot Password</title>
  <!-- Favicon -->
  <link rel="icon" href="{% static 'images/asset_abbr_logo_tm.png' %}" type="image/x-icon">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;800&display=swap');

    * {
      box-sizing: border-box;
    }

    body {
      background-color: #f6f5f7;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Montserrat', sans-serif;
      height: 100vh;
      margin: 0;
    }

    .forgot-password-container {
      background-color: #ffffff;
      border-radius: 10px;
      box-shadow: 0px 14px 28px rgba(0, 0, 0, 0.25), 0 10px 10px rgba(0, 0, 0, 0.22);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 50px;
      width: 350px;
      text-align: center;
    }

    h3 {
      font-weight: bold;
      color: #333;
      margin-bottom: 20px;
      margin-top: 0;
    }

    p {
      font-size: 14px;
      color: #555;
      margin: 0 0 20px 0;
      width: 100%;
    }

    .company-logo {
      margin-bottom: 0px;
    }

    .company-logo img {
      max-width: 100%;
      height: auto;
    }

    .forgot-password-form input[type="email"] {
      background-color: #eee;
      border: none;
      border-radius: 20px;
      padding: 12px 15px;
      margin-top: 10px;
      width: 100%;
      outline: none;
      color: #000000;
      font-family: 'Montserrat', sans-serif;
    }

    .forgot-password-form button {
      width: 100%;
      border-radius: 20px;
      border: 1px solid #1a9cdd;
      background-color: #1a9cdd;
      color: #ffffff;
      font-size: 11px;
      font-weight: bold;
      padding: 12px 15px;
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: transform 80ms ease-in;
      font-family: 'Montserrat', sans-serif;
      cursor: pointer;
      margin-top: 10px;
    }

    .forgot-password-form button:hover {
      background-color: #1f6a96;
    }

    a {
      color: #1a9cdd;
      text-decoration: none;
      font-size: 14px;
      margin-top: 20px;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <div class="forgot-password-container">
    <h3>Password Reset</h3>
    <div class="company-logo">
      <img src="{% static 'images/asset_primary_logo_tm.png' %}" alt="Company Logo">
    </div>
    <p>Enter your email address below, and we'll email instructions for setting a new password if an associated account
      exists.</p>

    <form method="post" class="forgot-password-form">
      {% csrf_token %}
      <input type="email" placeholder="Email" id="email" name="email" required>
      <button type="submit">Submit</button>
    </form>

    <a href="{% url 'auth-page' %}">Back to Login</a>
  </div>
</body>

</html>
